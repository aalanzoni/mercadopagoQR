# =========================================================
# Mercado Pago - QR PRESENCIAL (Stores / POS / Orders)
# Usado por: MP_QR_HIBRIDO / MP_POINT
# App MP: SSG-MPQR  (Producto integrado = Pagos presenciales / QR)
# =========================================================
# Valores posibles: test | prod
mp.etapa=prod

mp.configFile=mercadopagoQR.properties

# Base URL (igual para test/prod; el entorno lo determina el token)
mp.baseUrl=https://api.mercadopago.com

# =========================================================
# Credenciales TEST
# =========================================================
mp.accessTokenTest=APP_USR-3095057052253929-121514-f37cc2babcd47e57130c9e910d96088f-1859061146
mp.publicKeyTest=APP_USR-86097080-a419-4351-ae00-38501e39cdae
mp.userIdTest=1859061146

# =========================================================
# Credenciales PROD  --> APP SSG-MPQR (QR presencial)
# OJO: mp.userId = numero del FINAL del access token (545876266)
# =========================================================
mp.accessToken=APP_USR-1266115572033975-061713-751c25c74588bd4e7d441eebdddd42c2-545876266
mp.publicKey=APP_USR-07f769b3-63ce-446e-a1d0-3a6031b860a6
mp.userId=545876266

# =========================================================
# Timeouts (ms)
# =========================================================
mp.timeout.connect=10000
mp.timeout.socket=20000

# =========================================================
# Endpoints (QR hibrido)
# =========================================================

# Orders QR (payment processing)
mp.endpoint.createOrder=/v1/orders
mp.endpoint.getOrder=/v1/orders/%s
mp.endpoint.cancelOrder=/v1/orders/%s/cancel
mp.endpoint.refundOrder=/v1/orders/%s/refund
mp.endpoint.createStore=/users/%s/stores
mp.endpoint.createPos=/pos
mp.endpoint.searchStores=/users/%s/stores/search
mp.endpoint.searchPos=/pos
mp.endpoint.getPayment=/v1/payments/%s

# MP Point
mp.endpoint.point.createIntent=/point/integration-api/devices/%s/payment-intents
mp.endpoint.point.getIntent=/point/integration-api/payment-intents/%s
mp.endpoint.point.cancelIntent=/point/integration-api/devices/%s/payment-intents

mp.log.http=true
mp.log.http.max=2000

# =========================================================
# Restriccion de medios de pago
# true = solo debito y plata en cuenta
# false = todos los medios habilitados
# =========================================================
mp.only_debit_account_money=true

